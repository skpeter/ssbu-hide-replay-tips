name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: plugin
          cache-all-crates: true
      - name: Install Skyline
        run: |
          cargo install cargo-skyline
          cargo-skyline skyline update-std
      - name: Build release NRO
        run: RUSTFLAGS=-g cargo-skyline skyline build --release
      - name: Package SD zip
        run: bash scripts/package-sd.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            hide-replay-tips-sd.zip \
            --title "Hide Replay Tips ${GITHUB_REF_NAME}" \
            --notes-file - <<EOF
          Drop-in Skyline plugin. Extract onto the SD root (ARCropolis required).

          \`\`\`
          atmosphere/contents/01006A800016E000/romfs/skyline/plugins/libhide_replay_tips.nro
          \`\`\`

          Vanilla replay/movie HUD layouts are patched in memory. No Nintendo files are included.
          EOF
